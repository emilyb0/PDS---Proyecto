# Alembic: las migraciones se escriben a mano (no se usa autogenerate: el esquema manda sobre los modelos).
# La URL de la base sale de la variable de entorno BD_URL (ver migraciones/env.py).

[alembic]
script_location = %(here)s/migraciones
prepend_sys_path = .
path_separator = os
file_template = %%(rev)s_%%(slug)s
timezone = America/Bogota

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARNING
handlers = console
qualname =

[logger_sqlalchemy]
level = WARNING
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
